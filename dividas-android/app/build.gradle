plugins { id 'com.android.application' }
android {
    namespace 'app.dividas.controle'
    compileSdk 36
    buildFeatures { buildConfig true }
    sourceSets { main { assets.setSrcDirs([]) } }
    defaultConfig {
        applicationId 'app.dividas.controle'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '0.4.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { debug { storeFile rootProject.file('.tools/debug.keystore') } }
    buildTypes {
        debug { applicationIdSuffix '.teste'; versionNameSuffix '-teste'; debuggable true }
        release { minifyEnabled false; debuggable false }
        personal { initWith release; applicationIdSuffix '.pessoal'; versionNameSuffix '-pessoal'; signingConfig signingConfigs.debug; debuggable false }
    }
}
dependencies { implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22'); implementation 'androidx.browser:browser:1.9.0' }



